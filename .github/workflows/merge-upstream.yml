name: Merge Upstream
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: merge-upstream
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Preserve fork changes, merge upstream in a review branch
        run: python3 tools/maintenance/update_upstream.py --repository "$GITHUB_REPOSITORY" --dispatch-validation
