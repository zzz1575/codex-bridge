name: Refresh Pending Sync PRs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: refresh-sync-prs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/maintenance/update_upstream.py --repository "$GITHUB_REPOSITORY" --refresh-only --dispatch-validation
