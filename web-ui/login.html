<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in · Codex Bridge</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #111716;
        color: #f1f5f3;
      }
      main {
        width: min(100%, 380px);
        padding: 30px 26px;
        border: 1px solid #35433e;
        border-radius: 20px;
        background: #1b2421;
        box-shadow: 0 18px 56px #0005;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 25px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 26px;
        color: #aebdb5;
        line-height: 1.45;
      }
      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 11px 13px;
        border: 1px solid #53645c;
        border-radius: 10px;
        background: #101714;
        color: #f1f5f3;
        font: inherit;
        font-size: 16px;
      }
      input:focus {
        outline: 2px solid #54c99e;
        outline-offset: 2px;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        background: #54c99e;
        color: #0b2118;
        font: inherit;
        font-weight: 700;
      }
      .error {
        margin: 0 0 16px;
        color: #ffaea5;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #edf2ef;
          color: #18211c;
        }
        main {
          background: #fff;
          border-color: #cbd8d0;
          box-shadow: 0 18px 56px #25372b1c;
        }
        p {
          color: #58695e;
        }
        input {
          background: #fff;
          color: #18211c;
          border-color: #84998b;
        }
        .error {
          color: #a72d26;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex Bridge</h1>
      <p>Sign in to continue</p>
      <!--LOGIN_ERROR-->
      <form method="post" action="/login" autocomplete="on">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="next"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          enterkeyhint="go"
          required
        />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
